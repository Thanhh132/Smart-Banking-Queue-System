<app-header
  [title]="'Chọn dịch vụ'">
</app-header>

@if (errorMessage) {
  <p>{{ errorMessage }}</p>
}

@if (services.length === 0 && !errorMessage) {
  <p>Đang tải danh sách dịch vụ...</p>
}

@for (service of services; track service.serviceId) {

  <app-button
    [label]="service.serviceName"
    (clicked)="selectService(service.serviceId)">
  </app-button>

  <br />
  <br />

}
