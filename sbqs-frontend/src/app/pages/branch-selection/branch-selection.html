<app-header
  [title]="'Chọn chi nhánh'">
</app-header>

@if (errorMessage) {
  <p>{{ errorMessage }}</p>
}

@if (branches.length === 0 && !errorMessage) {
  <p>Đang tải danh sách chi nhánh...</p>
}

@for (branch of branches; track branch.branchId) {

  <app-button
    [label]="branch.branchName"
    (clicked)="selectBranch(branch.branchId)">
  </app-button>

  <br />
  <br />

}
