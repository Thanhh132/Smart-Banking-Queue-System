<h2>Chọn chi nhánh</h2>

@if (errorMessage) {
  <p>{{ errorMessage }}</p>
}

@if (branches.length === 0 && !errorMessage) {
  <p>Đang tải danh sách chi nhánh...</p>
}

@for (branch of branches; track branch.branchId) {
  <button (click)="selectBranch(branch.branchId)">
    {{ branch.branchName }}
  </button>

  <br />
  <br />
}
