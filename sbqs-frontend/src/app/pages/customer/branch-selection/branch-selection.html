<app-dashboard-layout>
  <app-page-header
    title="Chon chi nhanh"
    subtitle="Chon diem giao dich de lay so thu tu"
  >
  </app-page-header>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <app-card *ngIf="branches.length === 0 && !errorMessage">
    <div class="loading-state">
      <p>Dang tai danh sach chi nhanh...</p>
    </div>
  </app-card>

  <app-card *ngIf="branches.length > 0">
    <div class="card-header">
      <div>
        <h2>Danh sach chi nhanh</h2>
        <p>Thong tin khu vuc va dia chi giup ban chon dung diem giao dich.</p>
      </div>
    </div>

    <div class="branches-grid">
      <button
        type="button"
        class="branch-tile"
        *ngFor="let branch of branches"
        (click)="selectBranch(branch.branchId)"
      >
        <span>{{ branch.bankName }}</span>
        <strong>{{ branch.branchName }}</strong>
        <p>{{ branch.district || '-' }}, {{ branch.province || '-' }}</p>
        <small>{{ branch.address || 'Chua co dia chi chi tiet' }}</small>
      </button>
    </div>
  </app-card>
</app-dashboard-layout>
