@if (ticket) {

  <app-header
    [title]="'Phiếu giao dịch'">
  </app-header>

  <app-card>

    <div class="ticket-number">
      {{ ticket.ticketNumber }}
    </div>

    <div class="ticket-status">
      {{ ticket.status }}
    </div>

    <p>
      Vui lòng chờ đến lượt giao dịch
    </p>

  </app-card>

}
