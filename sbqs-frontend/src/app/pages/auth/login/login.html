<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-heading">
      <span>Cổng đăng nhập an toàn</span>
      <h1>Đăng nhập</h1>
      <p>Truy cập hệ thống quản lý hàng đợi ngân hàng.</p>
    </div>

    <form
      [formGroup]="loginForm"
      (ngSubmit)="submit()"
      class="auth-form"
      autocomplete="off"
      data-form-type="other"
    >
      <label>
        Email
        <input
          appPreventAutofill
          type="email"
          formControlName="email"
          name="sbqs-login-identity"
          placeholder="name@sbqs.com"
          autocomplete="off"
        />
        <small *ngIf="loginForm.controls.email.touched && loginForm.controls.email.invalid">
          Vui lòng nhập email hợp lệ.
        </small>
      </label>

      <label>
        Mật khẩu
        <span class="password-input">
          <input
            appPreventAutofill
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            name="sbqs-login-secret"
            placeholder="Nhập mật khẩu"
            autocomplete="off"
          />
          <button
            type="button"
            class="password-input__toggle"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </span>
        <small *ngIf="loginForm.controls.password.touched && loginForm.controls.password.invalid">
          Vui lòng nhập mật khẩu.
        </small>
      </label>

      <a class="auth-help-link" routerLink="/forgot-password">Quên mật khẩu?</a>

      <div *ngIf="errorMessage" class="auth-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isSubmitting">
        <app-icon *ngIf="!isSubmitting" name="login" [size]="18" />
        {{ isSubmitting ? 'Đang xác thực...' : 'Đăng nhập' }}
      </button>
    </form>

    <div class="auth-divider"><span>hoặc</span></div>
    <button
      type="button"
      class="google-login"
      [disabled]="isGoogleSubmitting || isSubmitting"
      (click)="loginWithGoogle()"
    >
      <span class="google-login__mark" aria-hidden="true">G</span>
      {{ isGoogleSubmitting ? 'Đang chuyển đến Google...' : 'Tiếp tục với Google' }}
    </button>

    <section class="dev-login-accounts" *ngIf="devAccounts.length" aria-labelledby="dev-login-title">
      <div class="dev-login-accounts__heading">
        <div>
          <span>LOCAL TEST</span>
          <strong id="dev-login-title">Tài khoản kiểm thử</strong>
        </div>
        <small>Bấm một tài khoản để tự điền thông tin đăng nhập.</small>
      </div>

      <div class="dev-login-accounts__list">
        <button
          *ngFor="let account of devAccounts"
          type="button"
          class="dev-login-account"
          (click)="fillDevAccount(account)"
        >
          <span>
            <strong>{{ account.label }}</strong>
            <small>{{ account.email }}</small>
          </span>
          <em>{{ account.role }}</em>
        </button>
      </div>
    </section>

    <p class="auth-switch">
      Khách hàng mới?
      <a routerLink="/register">Đăng ký tài khoản</a>
    </p>
  </section>
</main>
