<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-heading">
      <span>SBQS</span>
      <h1>Dang nhap</h1>
      <p>Su dung tai khoan duoc cap hoac tai khoan khach hang cua ban.</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="submit()" class="auth-form">
      <label>
        Email
        <input type="email" formControlName="email" placeholder="name@sbqs.com" />
      </label>

      <label>
        Mat khau
        <input type="password" formControlName="password" placeholder="Nhap mat khau" />
      </label>

      <div *ngIf="errorMessage" class="auth-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Dang xu ly...' : 'Dang nhap' }}
      </button>
    </form>

    <p class="auth-switch">
      Khach hang moi?
      <a routerLink="/register">Dang ky tai khoan</a>
    </p>
  </section>
</main>
