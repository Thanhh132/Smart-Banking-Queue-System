<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-heading">
      <span>SBQS</span>
      <h1>Đặt lại mật khẩu</h1>
      <p>Mật khẩu mới cần có chữ hoa, chữ thường, chữ số, ký tự đặc biệt và ít nhất 8 ký tự.</p>
    </div>

    <div *ngIf="isCompleted" class="auth-success">
      Mật khẩu đã được cập nhật. <a routerLink="/login">Đăng nhập ngay</a>
    </div>

    <form
      *ngIf="!isCompleted"
      [formGroup]="form"
      (ngSubmit)="submit()"
      class="auth-form"
      autocomplete="off"
      data-form-type="other"
    >
      <label>
        Mật khẩu mới
        <span class="password-input">
          <input
            appPreventAutofill
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            name="sbqs-reset-secret"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-input__toggle"
            (click)="togglePasswordVisibility('password')"
            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </span>
      </label>

      <label>
        Xác nhận mật khẩu
        <span class="password-input">
          <input
            appPreventAutofill
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            name="sbqs-reset-secret-confirmation"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-input__toggle"
            (click)="togglePasswordVisibility('confirmPassword')"
            [attr.aria-label]="showConfirmPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <app-icon [name]="showConfirmPassword ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </span>
      </label>

      <div *ngIf="errorMessage" class="auth-error">{{ errorMessage }}</div>

      <button type="submit" [disabled]="isSubmitting || !token">
        <app-icon *ngIf="!isSubmitting" name="key" [size]="18" />
        {{ isSubmitting ? 'Đang cập nhật...' : 'Cập nhật mật khẩu' }}
      </button>
    </form>
  </section>
</main>
