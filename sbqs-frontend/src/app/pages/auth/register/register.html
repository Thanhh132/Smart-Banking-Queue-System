<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-heading">
      <span>SBQS Customer</span>
      <h1>Đăng ký tài khoản</h1>
      <p>Tạo tài khoản để đặt lịch và lấy số tại chi nhánh ngân hàng.</p>
    </div>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="submit()"
      class="auth-form"
      autocomplete="off"
      data-form-type="other"
    >
      <label>
        Họ và tên
        <input
          appPreventAutofill
          type="text"
          formControlName="fullName"
          placeholder="Nguyễn Văn A"
          autocomplete="off"
        />
      </label>

      <label>
        Email
        <input
          appPreventAutofill
          type="email"
          formControlName="email"
          name="sbqs-register-identity"
          placeholder="customer@email.com"
          autocomplete="off"
        />
      </label>

      <label>
        Số điện thoại
        <input
          appPreventAutofill
          type="tel"
          formControlName="phone"
          placeholder="0900000000"
          autocomplete="off"
        />
      </label>

      <label>
        Mật khẩu
        <span class="password-input">
          <input
            appPreventAutofill
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            name="sbqs-register-secret"
            placeholder="Ít nhất 8 ký tự, có hoa, thường, số và ký tự đặc biệt"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-input__toggle"
            (click)="togglePasswordVisibility('password')"
            [attr.aria-label]="showPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <app-icon [name]="showPassword ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </span>
      </label>

      <label>
        Xác nhận mật khẩu
        <span class="password-input">
          <input
            appPreventAutofill
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            name="sbqs-register-secret-confirmation"
            placeholder="Nhập lại mật khẩu"
            autocomplete="new-password"
          />
          <button
            type="button"
            class="password-input__toggle"
            (click)="togglePasswordVisibility('confirmPassword')"
            [attr.aria-label]="showConfirmPassword ? 'Ẩn mật khẩu' : 'Hiện mật khẩu'"
          >
            <app-icon [name]="showConfirmPassword ? 'eye-off' : 'eye'" [size]="18" />
          </button>
        </span>
      </label>

      <div *ngIf="errorMessage" class="auth-error">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="auth-success">
        {{ successMessage }}
      </div>

      <button type="submit" [disabled]="isSubmitting">
        <app-icon *ngIf="!isSubmitting" name="user-plus" [size]="18" />
        {{ isSubmitting ? 'Đang tạo tài khoản...' : 'Đăng ký' }}
      </button>
    </form>

    <p class="auth-switch">
      Đã có tài khoản?
      <a routerLink="/login">Đăng nhập</a>
    </p>
  </section>
</main>
