<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-heading">
      <span>SBQS Customer</span>
      <h1>Đăng ký tài khoản</h1>
      <p>Tạo tài khoản để đặt lịch và lấy số tại chi nhánh ngân hàng.</p>
    </div>

    <form
      [formGroup]="registerForm"
      (ngSubmit)="submit()"
      class="auth-form"
      autocomplete="off"
      data-form-type="other"
    >
      <label>
        Họ và tên
        <input
          appPreventAutofill
          type="text"
          formControlName="fullName"
          placeholder="Nguyễn Văn A"
          autocomplete="off"
        />
      </label>

      <label>
        Email
        <input
          appPreventAutofill
          type="email"
          formControlName="email"
          name="sbqs-register-identity"
          placeholder="customer@email.com"
          autocomplete="off"
        />
      </label>

      <label>
        Số điện thoại
        <input
          appPreventAutofill
          type="tel"
          formControlName="phone"
          placeholder="0900000000"
          autocomplete="off"
        />
      </label>

      <label>
        Mật khẩu
        <input
          appPreventAutofill
          type="password"
          formControlName="password"
          name="sbqs-register-secret"
          placeholder="Ít nhất 8 ký tự, có hoa, thường, số và ký tự đặc biệt"
          autocomplete="new-password"
        />
      </label>

      <div *ngIf="errorMessage" class="auth-error">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="auth-success">
        {{ successMessage }}
      </div>

      <button type="submit" [disabled]="isSubmitting">
        <app-icon *ngIf="!isSubmitting" name="user-plus" [size]="18" />
        {{ isSubmitting ? 'Đang tạo tài khoản...' : 'Đăng ký' }}
      </button>
    </form>

    <p class="auth-switch">
      Đã có tài khoản?
      <a routerLink="/login">Đăng nhập</a>
    </p>
  </section>
</main>
