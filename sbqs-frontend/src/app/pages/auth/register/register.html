<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-heading">
      <span>SBQS Customer</span>
      <h1>Đăng ký tài khoản</h1>
      <p>Tạo tài khoản để đặt lịch và lấy số tại chi nhánh ngân hàng.</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="submit()" class="auth-form">
      <label>
        Họ và tên
        <input type="text" formControlName="fullName" placeholder="Nguyễn Văn A" autocomplete="name" />
      </label>

      <label>
        Email
        <input type="email" formControlName="email" placeholder="customer@email.com" autocomplete="email" />
      </label>

      <label>
        Số điện thoại
        <input type="tel" formControlName="phone" placeholder="0900000000" autocomplete="tel" />
      </label>

      <label>
        Mật khẩu
        <input type="password" formControlName="password" placeholder="Tối thiểu 8 ký tự" autocomplete="new-password" />
      </label>

      <div *ngIf="errorMessage" class="auth-error">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Đang tạo tài khoản...' : 'Đăng ký' }}
      </button>
    </form>

    <p class="auth-switch">
      Đã có tài khoản?
      <a routerLink="/login">Đăng nhập</a>
    </p>
  </section>
</main>
