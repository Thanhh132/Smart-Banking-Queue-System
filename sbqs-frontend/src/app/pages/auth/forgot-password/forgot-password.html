<main class="auth-shell">
  <section class="auth-panel">
    <div class="auth-heading">
      <span>SBQS</span>
      <h1>Quên mật khẩu</h1>
      <p>Nhập email tài khoản để nhận liên kết đặt lại mật khẩu.</p>
    </div>

    <div *ngIf="isSubmitted" class="auth-success">
      Nếu email hợp lệ, SBQS đã gửi liên kết đặt lại mật khẩu. Vui lòng kiểm tra hộp thư.
    </div>

    <form *ngIf="!isSubmitted" [formGroup]="form" (ngSubmit)="submit()" class="auth-form">
      <label>
        Email
        <input type="email" formControlName="email" placeholder="name@sbqs.com" autocomplete="email" />
      </label>

      <button type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Đang gửi...' : 'Gửi liên kết' }}
      </button>
    </form>

    <p class="auth-switch"><a routerLink="/login">Quay lại đăng nhập</a></p>
  </section>
</main>
