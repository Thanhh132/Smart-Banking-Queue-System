@if (open()) {
  <div class="app-confirm-dialog__backdrop" (click)="cancel()">
    <section
      class="app-confirm-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="app-confirm-dialog-title"
      aria-describedby="app-confirm-dialog-message"
      (click)="$event.stopPropagation()"
    >
      <header class="app-confirm-dialog__header">
        <h2 id="app-confirm-dialog-title">{{ title() }}</h2>
      </header>
      <div class="app-confirm-dialog__body">
        <p id="app-confirm-dialog-message">{{ message() }}</p>
      </div>
      <footer class="app-confirm-dialog__footer">
        <app-button
          variant="secondary"
          [label]="cancelLabel()"
          [disabled]="loading()"
          (clicked)="cancel()"
        />
        <app-button
          [variant]="danger() ? 'danger' : 'primary'"
          [label]="confirmLabel()"
          [loading]="loading()"
          (clicked)="confirm()"
        />
      </footer>
    </section>
  </div>
}
