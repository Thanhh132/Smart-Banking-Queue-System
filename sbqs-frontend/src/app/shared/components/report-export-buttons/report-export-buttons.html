<div class="report-export">
  <div class="report-export__buttons">
    <app-button
      variant="danger"
      size="sm"
      icon="file-text"
      label="Xuất PDF"
      [outline]="true"
      [loading]="loadingFormat === 'pdf'"
      [disabled]="loadingFormat !== null"
      (clicked)="export('pdf')"
    />
    <app-button
      variant="success"
      size="sm"
      icon="file-spreadsheet"
      label="Xuất Excel"
      [outline]="true"
      [loading]="loadingFormat === 'xlsx'"
      [disabled]="loadingFormat !== null"
      (clicked)="export('xlsx')"
    />
  </div>
  <small *ngIf="errorMessage">{{ errorMessage }}</small>
</div>
