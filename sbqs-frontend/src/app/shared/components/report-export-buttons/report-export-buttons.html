<div class="report-export">
  <div class="report-export__buttons d-flex flex-wrap gap-2">
    <button type="button" class="report-button report-button--pdf" (click)="export('pdf')" [disabled]="loadingFormat !== null">
      <app-icon name="file-text" [size]="17" />
      {{ loadingFormat === 'pdf' ? 'Đang tạo...' : 'Xuất PDF' }}
    </button>
    <button type="button" class="report-button report-button--excel" (click)="export('xlsx')" [disabled]="loadingFormat !== null">
      <app-icon name="file-spreadsheet" [size]="17" />
      {{ loadingFormat === 'xlsx' ? 'Đang tạo...' : 'Xuất Excel' }}
    </button>
  </div>
  <small *ngIf="errorMessage">{{ errorMessage }}</small>
</div>
