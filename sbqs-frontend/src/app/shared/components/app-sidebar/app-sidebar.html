<aside
  class="sidebar sidebar-fixed border-end"
  [class.sidebar-narrow]="collapsed"
  [class.show]="open"
  aria-label="Điều hướng chính"
>
  <div class="sidebar-header border-bottom">
    <a class="sidebar-brand" [routerLink]="menuItems[0]?.route || '/'" (click)="closeMobileSidebar()">
      <span class="sidebar-brand-mark">SB</span>
      <span class="sidebar-brand-full">
        <strong>SBQS</strong>
        <small>Hệ thống xếp hàng ngân hàng</small>
      </span>
    </a>

    <button type="button" class="sidebar-close" (click)="closeMobileSidebar()" aria-label="Đóng menu">
      ×
    </button>
  </div>

  <nav class="sidebar-nav compact" aria-label="Menu theo vai trò">
    <div class="nav-item" *ngFor="let item of menuItems">
      <a
        class="nav-link"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        [title]="collapsed ? item.label : ''"
        (click)="closeMobileSidebar()"
      >
        <span class="nav-icon"><app-icon [name]="item.icon" [size]="18" /></span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-footer border-top">
    <button type="button" class="sidebar-logout d-sidebar-narrow-none" (click)="logout()">
      <app-icon name="logout" [size]="18" />
      <span>Đăng xuất</span>
    </button>
    <button
      type="button"
      class="sidebar-toggler"
      (click)="toggleCollapse()"
      [attr.aria-label]="collapsed ? 'Mở rộng sidebar' : 'Thu gọn sidebar'"
      [title]="collapsed ? 'Mở rộng sidebar' : 'Thu gọn sidebar'"
    ></button>
  </div>
</aside>

<button
  *ngIf="open"
  type="button"
  class="sidebar-backdrop fade show"
  (click)="closeMobileSidebar()"
  aria-label="Đóng menu"
></button>
