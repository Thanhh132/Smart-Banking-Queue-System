<div class="dashboard-layout">
  <app-sidebar></app-sidebar>
  <main class="dashboard-layout__main">
    <app-topbar [title]="title"></app-topbar>
    @if (isFallbackSession) {
      <div class="dashboard-layout__fallback-warning" role="status">Dịch vụ đăng nhập chính đang gián đoạn. Một số thao tác quản trị tạm thời bị khóa.</div>
    }
    <app-live-ticket-notice></app-live-ticket-notice>

    <section class="dashboard-layout__content">
      <ng-content></ng-content>
    </section>
  </main>
</div>
