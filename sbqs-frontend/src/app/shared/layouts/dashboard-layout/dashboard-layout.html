<div class="dashboard-layout" [class.dashboard-layout--collapsed]="sidebarCollapsed()">
  <app-sidebar
    [collapsed]="sidebarCollapsed()"
    [open]="sidebarOpen()"
    (closeRequested)="closeMobileSidebar()"
    (collapseRequested)="toggleSidebarCollapse()"
  ></app-sidebar>

  <main class="dashboard-layout__main wrapper d-flex flex-column min-vh-100">
    <app-topbar [title]="title" (sidebarToggle)="toggleSidebar()"></app-topbar>
    @if (isLocalTestSession) {
      <div class="dashboard-layout__fallback-warning" role="status">Bạn đang dùng Dev Login hoặc đăng nhập dự phòng. Các thao tác thay đổi danh tính và xóa dữ liệu đang bị khóa.</div>
    }
    <app-live-ticket-notice></app-live-ticket-notice>

    <section class="dashboard-layout__content">
      <ng-content></ng-content>
    </section>
  </main>
</div>
