# Copy this file to application-local.properties for local development.
# MailHog captures all local emails at http://localhost:8025.

# Optional local infrastructure overrides:
# spring.datasource.url=jdbc:postgresql://localhost:5432/db_sbqs
# spring.datasource.username=admin
# spring.datasource.password=change-me
# keycloak.server-url=http://localhost:8080
# keycloak.admin-username=admin
# keycloak.admin-password=change-me

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

sbqs.password-reset.from-email=no-reply@sbqs.local
sbqs.password-reset.frontend-url=http://localhost:4200/reset-password
sbqs.password-reset.cooldown-minutes=5
sbqs.email-verification.from-email=no-reply@sbqs.local
sbqs.email-verification.frontend-url=http://localhost:4200/verify-email
sbqs.email-verification.resend-cooldown-minutes=1
sbqs.account-change.frontend-url=http://localhost:4200/confirm-account-change
sbqs.account-change.from-email=no-reply@sbqs.local
