# Copy this file to application-local.properties on your machine and fill real values.
# Do not commit application-local.properties.

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-gmail@gmail.com
spring.mail.password=your-gmail-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

sbqs.password-reset.from-email=your-gmail@gmail.com
sbqs.password-reset.frontend-url=http://localhost:4200/reset-password
sbqs.password-reset.cooldown-minutes=5
