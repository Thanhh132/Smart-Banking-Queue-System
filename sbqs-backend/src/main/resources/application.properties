server.port=8081
spring.application.name=sbqs-backend
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${SBQS_DB_URL:jdbc:postgresql://localhost:5432/db_sbqs}
spring.datasource.username=${SBQS_DB_USERNAME:admin}
spring.datasource.password=${SBQS_DB_PASSWORD:admin}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration

# Keycloak
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:SBQS}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:sbqs-frontend}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
keycloak.google-login-enabled=${SBQS_GOOGLE_LOGIN_ENABLED:true}
keycloak.google-redirect-uri=${SBQS_GOOGLE_REDIRECT_URI:http://localhost:4200/auth/google/callback}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/SBQS}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/SBQS/protocol/openid-connect/certs}
sbqs.auth.fallback.enabled=${SBQS_FALLBACK_AUTH_ENABLED:true}
sbqs.auth.fallback.issuer=${SBQS_FALLBACK_JWT_ISSUER:sbqs-fallback}
sbqs.auth.fallback.secret=${SBQS_FALLBACK_JWT_SECRET:}
sbqs.auth.fallback.access-token-minutes=${SBQS_FALLBACK_TOKEN_MINUTES:5}
sbqs.auth.fallback.allowed-roles=${SBQS_FALLBACK_ALLOWED_ROLES:CUSTOMER,STAFF,BRANCH_ADMIN,SUPER_ADMIN}

# Local test sessions are opt-in and always restricted to direct loopback requests.
sbqs.dev-login.enabled=${SBQS_DEV_LOGIN_ENABLED:false}
sbqs.auth.rate-limit.max-failures=${SBQS_LOGIN_MAX_FAILURES:5}
sbqs.auth.rate-limit.window-minutes=${SBQS_LOGIN_WINDOW_MINUTES:15}
sbqs.auth.rate-limit.block-minutes=${SBQS_LOGIN_BLOCK_MINUTES:15}
sbqs.email-verification.frontend-url=${SBQS_EMAIL_VERIFICATION_URL:http://localhost:4200/verify-email}
sbqs.email-verification.expiry-minutes=${SBQS_EMAIL_VERIFICATION_EXPIRY_MINUTES:30}
sbqs.email-verification.resend-cooldown-minutes=${SBQS_EMAIL_VERIFICATION_RESEND_COOLDOWN_MINUTES:1}
sbqs.email-verification.from-email=${SBQS_MAIL_FROM:no-reply@sbqs.local}
sbqs.account-change.frontend-url=${SBQS_ACCOUNT_CHANGE_URL:http://localhost:4200/confirm-account-change}
sbqs.account-change.expiry-minutes=${SBQS_ACCOUNT_CHANGE_EXPIRY_MINUTES:15}
sbqs.account-change.from-email=${SBQS_MAIL_FROM:no-reply@sbqs.local}
geocoding.nominatim-url=${NOMINATIM_URL:https://nominatim.openstreetmap.org/search}
geocoding.user-agent=${NOMINATIM_USER_AGENT:SBQS/1.0}

# Password reset (configure SMTP through SPRING_MAIL_* environment variables)
sbqs.password-reset.frontend-url=${SBQS_PASSWORD_RESET_URL:http://localhost:4200/reset-password}
sbqs.password-reset.expiry-minutes=${SBQS_PASSWORD_RESET_EXPIRY_MINUTES:15}
sbqs.password-reset.cooldown-minutes=${SBQS_PASSWORD_RESET_COOLDOWN_MINUTES:5}
sbqs.password-reset.from-email=${SBQS_MAIL_FROM:no-reply@sbqs.local}
spring.mail.properties.mail.smtp.connectiontimeout=${SBQS_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SBQS_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SBQS_MAIL_WRITE_TIMEOUT:5000}

# Idempotent super admin seed. Disabled unless explicitly enabled.
sbqs.seed.super-admin.enabled=${SBQS_SEED_SUPER_ADMIN_ENABLED:false}
sbqs.seed.super-admin.full-name=${SBQS_SUPER_ADMIN_FULL_NAME:SBQS Super Admin}
sbqs.seed.super-admin.email=${SBQS_SUPER_ADMIN_EMAIL:}
sbqs.seed.super-admin.password=${SBQS_SUPER_ADMIN_PASSWORD:}
sbqs.seed.super-admin.phone=${SBQS_SUPER_ADMIN_PHONE:}

# Camunda workflow
camunda.bpm.enabled=true
camunda.bpm.database.schema-update=true
camunda.bpm.history-level=audit
camunda.bpm.job-execution.enabled=true
camunda.bpm.webapp.enabled=true
camunda.bpm.webapp.application-path=/camunda
camunda.bpm.admin-user.id=${CAMUNDA_ADMIN_USERNAME:admin}
camunda.bpm.admin-user.password=${CAMUNDA_ADMIN_PASSWORD:admin}
camunda.bpm.admin-user.first-name=${CAMUNDA_ADMIN_FIRST_NAME:Camunda}
camunda.bpm.admin-user.last-name=${CAMUNDA_ADMIN_LAST_NAME:Administrator}

# Redis cache
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000}
spring.data.redis.repositories.enabled=false
sbqs.cache.default-ttl-minutes=${SBQS_CACHE_TTL_MINUTES:5}

# Smart routing (weights are normalized by the application)
sbqs.smart-routing.distance-weight=${SBQS_ROUTING_DISTANCE_WEIGHT:0.4}
sbqs.smart-routing.wait-weight=${SBQS_ROUTING_WAIT_WEIGHT:0.6}
sbqs.smart-routing.no-active-counter-penalty-minutes=${SBQS_ROUTING_NO_COUNTER_PENALTY_MINUTES:30}

# Kafka domain event logging
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.request.timeout.ms=3000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.max.block.ms=1000
spring.kafka.producer.properties.linger.ms=10
sbqs.kafka.enabled=${SBQS_KAFKA_ENABLED:true}
sbqs.kafka.topic.domain-events=${SBQS_KAFKA_DOMAIN_EVENTS_TOPIC:sbqs.domain-events}

# Web Push (generate one VAPID key pair per environment; never commit the private key)
sbqs.web-push.public-key=${SBQS_WEB_PUSH_PUBLIC_KEY:}
sbqs.web-push.private-key=${SBQS_WEB_PUSH_PRIVATE_KEY:}
sbqs.web-push.subject=${SBQS_WEB_PUSH_SUBJECT:mailto:no-reply@sbqs.local}
sbqs.web-push.ttl-seconds=${SBQS_WEB_PUSH_TTL_SECONDS:300}
